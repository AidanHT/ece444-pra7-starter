name: CI

on:
  push:
    branches: [main]  # pushes to main
  pull_request:  # every PR; checks out the merge commit (refs/pull/N/merge)

permissions:
  contents: read  # least privilege: GITHUB_TOKEN can only read the repo

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true  # a new push cancels the older run on the same branch/PR

# Job IDs (lint, format, tests) are the status-check names required by the
# require-ci-on-main ruleset. Each job runs on its own fresh VM, so each one
# repeats checkout, Python setup and install.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # stop a stuck job instead of waiting hours
    steps:
      - uses: actions/checkout@v7.0.1  # clone the repo onto the runner
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.2"  # same Python as local
          cache: pip  # reuse downloaded packages between runs
          cache-dependency-path: requirements-dev.txt  # cache key changes when this file does
      - run: python -m pip install -r requirements-dev.txt  # same pinned tools as local
      - run: python -m ruff check --output-format=github .  # Report lint findings as GitHub annotations

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:  # same setup as lint
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.2"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff format --check .  # Check formatting without changing files

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:  # same setup as lint
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.2"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --maxfail=1  # Run tests; stop after the first failure
